name: Helm chart and Kubernetes smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Lint chart
        run: helm lint ./charts/helm-charts-implementation

      - name: Render default chart
        run: helm template demo ./charts/helm-charts-implementation

      - name: Render Prometheus Operator resources
        run: |
          helm template demo ./charts/helm-charts-implementation \
            --namespace monitoring \
            --set metrics.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set metrics.serviceMonitor.additionalLabels.release=kube-prometheus-stack \
            --set metrics.prometheusRule.additionalLabels.release=kube-prometheus-stack

  kind-smoke-test:
    runs-on: ubuntu-latest
    needs: chart
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1.15.1

      - name: Deploy chart with NGINX metrics
        run: |
          helm upgrade --install observability ./charts/helm-charts-implementation \
            --namespace observability \
            --create-namespace \
            --set metrics.enabled=true \
            --wait \
            --timeout 5m

      - name: Verify rollout and chart connection test
        run: |
          kubectl rollout status deployment/observability-helm-charts-implementation \
            --namespace observability \
            --timeout=5m
          helm test observability --namespace observability --logs

      - name: Verify Prometheus exporter endpoint
        run: |
          kubectl port-forward \
            --namespace observability \
            service/observability-helm-charts-implementation \
            9113:9113 > /tmp/helm-metrics-port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9113/metrics > /tmp/nginx-metrics.txt; then
              break
            fi
            sleep 2
          done
          grep -q '^nginx_up' /tmp/nginx-metrics.txt
          grep -q '^nginx_connections_active' /tmp/nginx-metrics.txt

      - name: Show deployed resources
        if: always()
        run: kubectl get all --namespace observability
