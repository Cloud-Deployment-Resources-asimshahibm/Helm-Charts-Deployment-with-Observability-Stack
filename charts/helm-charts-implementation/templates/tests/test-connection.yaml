apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "helm-charts-implementation.fullname" . }}-test-connection"
  labels:
    {{- include "helm-charts-implementation.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "helm-charts-implementation.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never